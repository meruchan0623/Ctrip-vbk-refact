name: vbk release

# Release pipeline (plan I-18). Separate from the development CI
# (vbk-check.yml). Runs only on a version tag or when started by hand.
#
# STATUS: written without access to a runner, certificates or a registry; it
# has never been executed. Secrets are referenced by NAME ONLY - no
# certificate, key or password is stored in the repository. Without the
# secrets (workflow_dispatch with sign=false) the jobs build unsigned
# artifacts and still run the architecture / entitlement / string-scan
# checks; the signature checks are skipped and the job says so.
#
# Secrets (X6, to be provided by the owner):
#   APPLE_CERTIFICATE            base64 .p12 (Developer ID Application)
#   APPLE_CERTIFICATE_PASSWORD
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: NAME (TEAMID)"
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID   notarization (app-specific pw)
#   MAC_DEV_CERTIFICATE          base64 .p12 of the shared "VBK Dev Signing" test
#   MAC_DEV_CERTIFICATE_PASSWORD   identity (vbk/tools/mac-dev-signing.sh create);
#                                used when sign=false so every test build keeps
#                                the same designated requirement (keychain access)
#   WINDOWS_CERTIFICATE          base64 .pfx (Authenticode)
#   WINDOWS_CERTIFICATE_PASSWORD
#   WINDOWS_DEV_CERTIFICATE      base64 .pfx, self-signed "VBK Dev Signing" test cert; signs
#   WINDOWS_DEV_CERTIFICATE_PASSWORD  the exe/NSIS/MSI when sign=false (untrusted by Windows,
#                                but keeps a stable signer across test builds)
#   MINISIGN_SECRET_KEY / MINISIGN_PASSWORD     update signing (I-19), unused here

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign (and notarize on macOS). Needs the secrets above."
        type: boolean
        default: false
      publish:
        description: "Publish the built dmg/msi/exe as a PUBLIC pre-release (tag test-<run>-<sha>) so anyone can download them."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Signing is requested on tags, or by hand with sign=true.
  SIGN: ${{ (github.event_name == 'push' || inputs.sign) && 'true' || 'false' }}
  TAURI_CLI_VERSION: "2.*"

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-latest
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tools (tauri-cli, cargo-auditable, cargo-cyclonedx)
        run: cargo install tauri-cli@${{ env.TAURI_CLI_VERSION }} cargo-auditable cargo-cyclonedx --locked
      - name: Frontend bundle
        working-directory: vbk
        run: |
          npm ci
          npm run bundle:ui

      - name: Import signing certificate
        if: env.SIGN == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE" || { echo "::error::APPLE_CERTIFICATE secret missing"; exit 1; }
          kc="$RUNNER_TEMP/build.keychain"
          pw="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc"
          security list-keychains -d user -s "$kc" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build (cargo auditable, hardened runtime, notarize when signing)
        working-directory: vbk/src-tauri
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.SIGN == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ env.SIGN == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ env.SIGN == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.SIGN == 'true' && secrets.APPLE_TEAM_ID || '' }}
          VBK_GIT_COMMIT: ${{ github.sha }}
        # `--runner` is spawned as ONE executable and cargo-auditable refuses to run unless invoked
        # as `cargo auditable ...`, so point the runner at a tiny forwarding script.
        run: |
          # Empty identity is not "no identity" for Tauri (it fails with "no identity found"): unset when not signing.
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then unset APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; fi
          printf '#!/bin/sh\nexec cargo auditable "$@"\n' > "$RUNNER_TEMP/cargo-auditable-runner"
          chmod +x "$RUNNER_TEMP/cargo-auditable-runner"
          cargo tauri build --runner "$RUNNER_TEMP/cargo-auditable-runner" --target ${{ matrix.target }} --bundles app,dmg

      # sign=false: re-sign with the shared test identity (Tauri only accepts
      # trusted identities, so this cannot go through APPLE_CERTIFICATE) and
      # rebuild the dmg around the re-signed app.
      - name: Test signing (VBK Dev Signing)
        if: env.SIGN != 'true'
        working-directory: vbk
        env:
          MAC_DEV_CERTIFICATE: ${{ secrets.MAC_DEV_CERTIFICATE }}
          VBK_DEV_P12_PASSWORD: ${{ secrets.MAC_DEV_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MAC_DEV_CERTIFICATE" ]; then
            echo "::warning::MAC_DEV_CERTIFICATE missing - ad-hoc build, keychain logins will not survive upgrades"
            exit 0
          fi
          p12="$RUNNER_TEMP/dev.p12"
          echo "$MAC_DEV_CERTIFICATE" | base64 --decode > "$p12"
          out="src-tauri/target/${{ matrix.target }}/release/bundle"
          app="$(ls -d "$out"/macos/*.app | head -n1)"
          tools/mac-dev-signing.sh sign "$p12" "$app"
          rm -f "$p12" "$out"/dmg/*.dmg
          tools/mac-dev-signing.sh dmg "$app" "$out/dmg/$(basename "$app" .app)_test_${{ matrix.arch }}.dmg"

      - name: Architecture check (lipo -archs)
        run: |
          app="$(ls -d vbk/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -n1)"
          bin="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          archs="$(lipo -archs "$bin")"
          echo "lipo -archs: $archs"
          test "$archs" = "${{ matrix.arch }}" || { echo "::error::expected ${{ matrix.arch }}, got $archs"; exit 1; }

      - name: Entitlements must be empty
        run: |
          app="$(ls -d vbk/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -n1)"
          ents="$(codesign -d --entitlements - --xml "$app" 2>/dev/null || true)"
          if printf '%s' "$ents" | grep -q '<key>'; then
            echo "::error::non-empty entitlements:"; printf '%s\n' "$ents"; exit 1
          fi
          echo "entitlements: empty"

      - name: Signature, notarization, hardened runtime
        if: env.SIGN == 'true'
        run: |
          app="$(ls -d vbk/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -n1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | tee /dev/stderr | grep -q 'flags=.*runtime' \
            || { echo "::error::hardened runtime flag missing"; exit 1; }
          spctl -a -vv "$app"
          xcrun stapler validate "$app"

      - name: Unsigned build notice
        if: env.SIGN != 'true'
        env:
          HAS_DEV_CERT: ${{ secrets.MAC_DEV_CERTIFICATE != '' }}
        run: |
          app="$(ls -d vbk/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -n1)"
          codesign -dr - "$app" 2>&1 | tee /dev/stderr
          if [ "$HAS_DEV_CERT" = "true" ]; then
            # Keychain access survives upgrades only with this fixed requirement.
            codesign -dr - "$app" 2>&1 | grep -q 'identifier "tech.tsim.vbk.client" and certificate leaf' \
              || { echo "::error::test build not signed with the shared VBK Dev Signing identity"; exit 1; }
            echo "::warning::test-signed build (VBK Dev Signing) - spctl/stapler checks SKIPPED"
          else
            echo "::warning::ad-hoc build - designated requirement changes per build, keychain logins will not survive upgrades"
          fi

      - name: Release-artifact string scan + size record
        run: |
          mkdir -p reports
          node vbk/tools/release-scan.mjs \
            --report reports/size-macos-${{ matrix.arch }}.json \
            vbk/ui/bundle \
            vbk/src-tauri/target/${{ matrix.target }}/release/bundle

      - name: SBOM
        working-directory: vbk/src-tauri
        run: |
          cargo cyclonedx --format json
          mkdir -p ../../reports
          cp ./*.cdx.json ../../reports/sbom-macos-${{ matrix.arch }}.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            vbk/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            reports/*

  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tools (tauri-cli, cargo-auditable, cargo-cyclonedx)
        run: cargo install tauri-cli@${{ env.TAURI_CLI_VERSION }} cargo-auditable cargo-cyclonedx --locked
      - name: Frontend bundle
        working-directory: vbk
        run: |
          npm ci
          npm run bundle:ui

      # sign=true: production Authenticode cert (required). sign=false: the shared
      # self-signed test cert when WINDOWS_DEV_CERTIFICATE exists, else unsigned.
      - name: Prepare Authenticode config
        id: winsign
        shell: pwsh
        env:
          CERT_B64: ${{ env.SIGN == 'true' && secrets.WINDOWS_CERTIFICATE || secrets.WINDOWS_DEV_CERTIFICATE }}
          CERT_PW: ${{ env.SIGN == 'true' && secrets.WINDOWS_CERTIFICATE_PASSWORD || secrets.WINDOWS_DEV_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERT_B64) {
            if ($env:SIGN -eq 'true') { Write-Error "WINDOWS_CERTIFICATE secret missing"; exit 1 }
            Write-Warning "WINDOWS_DEV_CERTIFICATE missing - building unsigned"
            "mode=none" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $pw = ConvertTo-SecureString $env:CERT_PW -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          # tauri.windows.conf.json already sets digestAlgorithm / timestampUrl / tsp.
          $cfg = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint } } } | ConvertTo-Json -Depth 5
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "sign.conf.json") -Value $cfg
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          if ($env:SIGN -eq 'true') { "mode=prod" >> $env:GITHUB_OUTPUT } else { "mode=dev" >> $env:GITHUB_OUTPUT }

      - name: Build (cargo auditable, NSIS + MSI)
        working-directory: vbk/src-tauri
        shell: pwsh
        env:
          VBK_GIT_COMMIT: ${{ github.sha }}
        run: |
          # Same forwarding shim as on macOS (cargo-auditable must be called as `cargo auditable`).
          $shim = Join-Path $env:RUNNER_TEMP "cargo-auditable-runner.cmd"
          Set-Content -Path $shim -Value "@cargo auditable %*" -Encoding ascii
          $extra = @()
          if ('${{ steps.winsign.outputs.mode }}' -ne 'none') { $extra = @("--config", (Join-Path $env:RUNNER_TEMP "sign.conf.json")) }
          cargo tauri build --runner $shim --target x86_64-pc-windows-msvc --bundles nsis,msi @extra

      - name: Authenticode verification (exe, NSIS installer, MSI)
        if: steps.winsign.outputs.mode == 'prod'
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $rel = "vbk/src-tauri/target/x86_64-pc-windows-msvc/release"
          $files = @(Get-ChildItem "$rel/*.exe") + @(Get-ChildItem "$rel/bundle/nsis/*.exe") + @(Get-ChildItem "$rel/bundle/msi/*.msi")
          if ($files.Count -lt 3) { Write-Error "expected app exe, NSIS installer and MSI"; exit 1 }
          foreach ($f in $files) {
            & $signtool verify /pa /v $f.FullName
            if ($LASTEXITCODE -ne 0) { Write-Error "signtool verify failed: $($f.Name)"; exit 1 }
          }

      # Test cert is self-signed, so trust-chain verification (signtool /pa) must fail;
      # check instead that every file carries a signature by the shared test cert.
      - name: Test signature check (VBK Dev Signing)
        if: steps.winsign.outputs.mode == 'dev'
        shell: pwsh
        run: |
          $rel = "vbk/src-tauri/target/x86_64-pc-windows-msvc/release"
          # Shipped installers must carry the test signature; loose exes in target/ are informational
          # (Tauri signs the copies it packs, not necessarily the build-tree binary).
          $must = @(Get-ChildItem "$rel/bundle/nsis/*.exe") + @(Get-ChildItem "$rel/bundle/msi/*.msi")
          if ($must.Count -lt 2) { Write-Error "expected NSIS installer and MSI"; exit 1 }
          foreach ($f in $must) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if (-not $sig.SignerCertificate -or $sig.SignerCertificate.Thumbprint -ne '${{ steps.winsign.outputs.thumbprint }}') {
              Write-Error "not signed by the test cert: $($f.Name) ($($sig.Status))"; exit 1
            }
            Write-Host "$($f.Name): signed by test cert ($($sig.Status))"
          }
          foreach ($f in @(Get-ChildItem "$rel/*.exe")) {
            Write-Host "info: $($f.Name): $((Get-AuthenticodeSignature $f.FullName).Status)"
          }
          Write-Warning "test-signed build (self-signed) - SmartScreen will still warn"

      - name: Unsigned build notice
        if: steps.winsign.outputs.mode == 'none'
        run: echo "::warning::unsigned build - signature checks SKIPPED"

      - name: Release-artifact string scan + size record
        shell: bash
        run: |
          mkdir -p reports
          node vbk/tools/release-scan.mjs \
            --report reports/size-windows-x86_64.json \
            vbk/ui/bundle \
            vbk/src-tauri/target/x86_64-pc-windows-msvc/release/bundle

      - name: SBOM
        shell: bash
        working-directory: vbk/src-tauri
        run: |
          cargo cyclonedx --format json
          mkdir -p ../../reports
          cp ./*.cdx.json ../../reports/sbom-windows-x86_64.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          if-no-files-found: error
          path: |
            vbk/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            vbk/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            reports/*

  # Tag builds only: a DRAFT release for a human to review and publish.
  # Never auto-publishes, never attaches update manifests (I-19 is separate).
  draft-release:
    name: GitHub release (draft on tags, public pre-release when publish=true)
    if: github.event_name == 'push' || inputs.publish
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Size comparison with the previous release (informational)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'size-*.json' --dir prev 2>/dev/null \
            || echo "no previous size reports"
          for f in dist/*/size-*.json; do
            name="$(basename "$f")"
            if [ -f "prev/$name" ]; then
              echo "== $name vs previous"; diff <(jq -S .sizes "prev/$name") <(jq -S .sizes "$f") || true
            fi
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
              dist/*/*.dmg dist/*/*.exe dist/*/*.msi dist/*/size-*.json dist/*/sbom-*.cdx.json
          else
            # Public, clearly marked as a test build (sign=false is self-signed, not notarized).
            tag="test-${{ github.run_number }}-${GITHUB_SHA::7}"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Test build $tag (sign=${{ inputs.sign }})" \
              --notes "Built from $GITHUB_SHA by workflow run ${{ github.run_id }}. sign=${{ inputs.sign }}: test-signed only (not Developer ID / not notarized; Windows self-signed, SmartScreen will warn)." \
              dist/*/*.dmg dist/*/*.exe dist/*/*.msi
          fi
